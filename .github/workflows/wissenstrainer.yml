name: Wissenstrainer

# Läuft, sobald etwas in wissenstrainer/ auf main landet (z. B. ein neues Dokument in oeffentlich/):
# 1. neue Dokumente mit Claude in Lernkarten-Pakete umwandeln (ein Unterordner = ein Paket)
#    und die Pakete nach wissenstrainer/app/data/pakete/ schreiben
# 2. die App unter wissenstrainer/app auf GitHub Pages veröffentlichen
on:
  push:
    branches: [main]
    paths: ["wissenstrainer/**", ".github/workflows/wissenstrainer.yml"]
  workflow_dispatch:
    inputs:
      retry_failed:
        description: "Fehlgeschlagene Dokumente erneut versuchen"
        type: boolean
        default: false
      rebuild:
        description: "Alle Dokumente neu auswerten (neue Karten – der Lernstand dieser Karten beginnt von vorn)"
        type: boolean
        default: false
      new_images:
        description: "Bilder neu suchen (ein in der App gewähltes Bild bleibt)"
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: wissenstrainer
  cancel-in-progress: false

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: wissenstrainer/pipeline/requirements.txt

      - run: pip install -r wissenstrainer/pipeline/requirements.txt

      - name: Dokumente verarbeiten
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          WT_MODEL: ${{ vars.WT_MODEL }}
          WT_EFFORT: ${{ vars.WT_EFFORT }}
          WT_MAX_CARDS: ${{ vars.WT_MAX_CARDS }}
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "::warning::Secret ANTHROPIC_API_KEY fehlt – Dokumente werden nicht verarbeitet."
            exit 0
          fi
          # leere Repo-Variablen nicht als Wert durchreichen
          [ -z "$WT_MODEL" ] && unset WT_MODEL
          [ -z "$WT_EFFORT" ] && unset WT_EFFORT
          [ -z "$WT_MAX_CARDS" ] && unset WT_MAX_CARDS
          # --prune: was nicht mehr im Ordner liegt, verschwindet auch aus dem Paket
          args="--prune"
          ${{ inputs.retry_failed == true }} && args="$args --retry-failed"
          ${{ inputs.rebuild == true }} && args="$args --rebuild"
          ${{ inputs.new_images == true }} && args="$args --new-images"
          python wissenstrainer/pipeline/extract.py $args

      - name: Karten ins Repo schreiben
        run: |
          git add wissenstrainer/app/data
          if git diff --cached --quiet; then
            echo "Keine Änderungen an den Karten."
            exit 0
          fi
          git config user.name "wissenstrainer-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Wissenstrainer: Pakete aktualisiert"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: wissenstrainer/app

  deploy:
    needs: extract
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
